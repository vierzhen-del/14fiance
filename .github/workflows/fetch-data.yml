name: Fetch ETF Data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/fetch-data.yml"
  schedule:
    # 매주 토요일 06:00 KST (금요일 21:00 UTC), 미국 장 마감 후
    - cron: "0 21 * * 5"

permissions:
  contents: write

# push 트리거(scripts/** 변경)와 수동 dispatch가 겹치면 여러 run이 같은 브랜치에
# 데이터 커밋을 경쟁해 push 단계가 non-fast-forward로 실패한다(2026-07-18 실측).
# 같은 브랜치의 동시 실행을 직렬화한다(취소하지 않고 대기).
concurrency:
  group: fetch-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ETF price data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: update ETF price data"
            git push || (git pull --rebase && git push)
          fi
