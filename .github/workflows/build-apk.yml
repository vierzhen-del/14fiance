name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "shared/**"
      - "capture/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # packages: '' 로 기본 설치를 끈다 — setup-android가 기본으로 받는 레거시 'tools'
      # 패키지가 Android SDK 저장소에서 제거돼 2026-09-16 빌드(run #280)가
      # "Failed to find package 'tools'"로 19초 만에 실패했다(워크플로·앱 코드 변경과
      # 무관한 외부 요인). 빌드에 필요한 platform/build-tools는 Gradle이 알아서 받는다.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install deps & build web assets
        working-directory: app
        env:
          # A54: 앱 실행 시 표시할 빌드 번호 — GitHub Actions의 이 워크플로 실행 순번을 그대로 쓴다.
          APK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm ci
          npm run build:www
          npx cap sync android

      # 사이드로드용 debug 서명 APK — 개인 단독 사용이라 별도 release 키 불필요.
      # (Play 스토어 등록이 필요해지면 그때 release keystore를 secrets로 추가)
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myassets-app-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
