# 임시 프로브: 월매수 계획 신규 12종 종목코드 일괄 확인용 (확인 후 삭제)
name: Probe Tickers (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Batch search Naver for ticker codes
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse, time

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                  "Accept": "application/json",
                  "Referer": "https://m.stock.naver.com/",
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.read().decode("utf-8")

          targets = [
              "RISE TDF2050액티브",
              "KODEX 미국AI광통신네트워크",
              "KODEX 미국휴머노이드로봇",
              "KoAct 미국나스닥채권혼합50액티브",
              "KODEX 미국성장커버드콜액티브",
              "TIME 미국나스닥100채권혼합50액티브",
              "KODEX 테슬라밸류체인FactSet",
              "ACE 구글밸류체인액티브",
              "KIWOOM 미국S&P500&GOLD",
              "ACE 글로벌AI맞춤형반도체",
              "TIGER TDF2045",
              "KIWOOM 미국AI테크하이베타",
          ]
          for name in targets:
              url = "https://ac.stock.naver.com/ac?q=" + urllib.parse.quote(name) + "&target=stock%2Cindex%2Cmarketindicator"
              try:
                  data = json.loads(get(url))
              except Exception as e:
                  print(f"TARGET={name} ERROR {e}")
                  continue
              print(f"===== TARGET: {name}")
              items = data.get("items") or []
              def walk(o):
                  out = []
                  if isinstance(o, dict):
                      if "code" in o and "name" in o:
                          out.append(o)
                      for v in o.values():
                          out.extend(walk(v))
                  elif isinstance(o, list):
                      for v in o:
                          out.extend(walk(v))
                  return out
              for it in walk(data):
                  print("  ITEM:", json.dumps({k: it.get(k) for k in ("code", "name", "typeName")}, ensure_ascii=False))
              time.sleep(0.4)
          EOF
