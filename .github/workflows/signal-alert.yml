# 워치리스트 시그널 텔레그램 알림 — 평일 2회(국내·미국 마감 후) 매일 요약 + 시그널 강조.
# ⚠️ GitHub 무료 스케줄은 혼잡 시 수 시간 지연/드롭될 수 있음(intraday-kr.yml과 동일 한계).
# 시크릿 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 미설정 시 안내 로그만 남기고 무해하게 종료.
# 워치리스트 변경: 저장소 변수(Settings→Secrets and variables→Actions→Variables) ALERT_WATCHLIST
# 에 콤마 구분 심볼(예: 005930.KS,000660.KS,SOXL,SOXX) — 미설정 시 기본 3종.
name: Signal Telegram Alert

on:
  schedule:
    - cron: "5 7 * * 1-5"   # 16:05 KST — 국내 장 마감 후
    - cron: "35 21 * * 1-5" # 06:35 KST(익일) — 미국 장 마감 후
  workflow_dispatch:
    inputs:
      force:
        description: "테스트 실행(정책상 항상 요약 발송이라 동작 동일)"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: signal-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 직전 등급 상태(등급 변화 🆕 표시용) — 저장소에 커밋하지 않고 캐시로만 보관
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Compute signals & send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_WATCHLIST: ${{ vars.ALERT_WATCHLIST }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FORCE_SUMMARY: ${{ github.event.inputs.force }}
        run: python scripts/signal_alert.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_state.json
          key: alert-state-${{ github.run_id }}
