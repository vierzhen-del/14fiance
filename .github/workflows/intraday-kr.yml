name: Intraday KR Prices

on:
  workflow_dispatch:
  schedule:
    # 국내 장중(09:00~15:30 KST = 00:00~06:30 UTC) 평일 30분 주기, 매시 정각/30분에서
    # 5분 offset(정시·30분은 전 세계 cron이 몰려 GitHub 큐가 가장 혼잡한 시각 —
    # 2026-07-06~10 실측 결과 정각 스케줄로는 지연이 수 시간~반나절까지 발생해 offset 적용).
    # 그래도 GitHub 무료 스케줄 큐는 지연·드롭이 흔한 best-effort라 100% 신뢰 불가.
    - cron: "5,35 0-6 * * 1-5"

permissions:
  contents: write

# n8n(Tab S9)이 workflow_dispatch로 30분마다 직접 호출하기 시작하면(2026-07-20,
# schedule 드롭 대응) 기존 schedule: 트리거와 겹칠 수 있다 — 동시 실행이 live 브랜치
# force-push를 경합하지 않도록 fetch-data.yml/signal-alert.yml과 같은 패턴으로 직렬화.
concurrency:
  group: intraday-kr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A51: 히트맵 등락률을 "전일종가" 기준으로 계산하려면 스크립트가 직전 실행 결과를
      # 봐야 한다. live 브랜치는 매번 force-push라 로컬에 이력이 안 남으므로, raw URL로
      # 현재 커밋을 받아온다 — 최초 실행 등으로 없으면(404) 조용히 건너뛴다.
      - name: Fetch previous snapshot
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/live/latest_kr.json" \
            -o /tmp/prev_latest_kr.json || echo "이전 스냅샷 없음(최초 실행 등) — 건너뜀"

      - name: Fetch intraday KR prices
        run: python scripts/fetch_intraday_kr.py latest_kr.json /tmp/prev_latest_kr.json

      # 개발 브랜치 이력을 오염시키지 않도록 전용 live 브랜치에
      # 항상 단일 커밋으로 force-push 한다(사이트는 raw URL로 읽음).
      - name: Publish to live branch
        run: |
          mkdir /tmp/live
          cp latest_kr.json /tmp/live/
          cd /tmp/live
          git init -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_kr.json
          git commit -m "chore: intraday KR prices"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
