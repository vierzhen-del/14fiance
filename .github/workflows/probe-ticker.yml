# 임시 프로브: KIWOOM 코스닥150커버드콜액티브 종목코드 확인용 (확인 후 삭제)
name: Probe Ticker (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search Naver for ticker code
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                  "Accept": "application/json",
                  "Referer": "https://m.stock.naver.com/",
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.read().decode("utf-8")

          for q in ["코스닥150커버드콜", "KIWOOM 코스닥150", "코스닥150커버드콜액티브"]:
              url = "https://m.stock.naver.com/api/search/all?query=" + urllib.parse.quote(q)
              try:
                  data = json.loads(get(url))
              except Exception as e:
                  print(f"QUERY={q} ERROR {e}")
                  continue
              print(f"===== QUERY: {q}")
              def walk(o, depth=0):
                  if isinstance(o, dict):
                      keys = set(o.keys())
                      if {"name", "code"} <= keys or {"itemCode", "stockName"} <= keys or {"reutersCode"} <= keys:
                          print("  ITEM:", json.dumps(o, ensure_ascii=False)[:300])
                      for v in o.values():
                          walk(v, depth + 1)
                  elif isinstance(o, list):
                      for v in o:
                          walk(v, depth + 1)
              walk(data)
          EOF
